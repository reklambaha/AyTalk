name: AyTalk Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show exact source being built
        shell: bash
        run: |
          echo "COMMIT=${GITHUB_SHA}"
          echo "BRANCH=${GITHUB_REF_NAME}"
          echo "App.tsx SHA256:"
          sha256sum App.tsx
          echo "index.js SHA256:"
          sha256sum index.js
          echo "Expected current AyTalk source markers:"
          grep -n "HomeDashboard" App.tsx | head -3
          grep -n "RemoteCallScreen" App.tsx | head -3
          test -f src/features/home/screens/HomeDashboard.tsx
          test -f src/components/FirstRunOnboarding.tsx
          test -f src/features/emergency/EmergencyMode.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Clean old Android outputs
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK contains current JS bundle
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "APK SHA256:"
          sha256sum "$APK"
          echo "APK size:"
          ls -lh "$APK"
          unzip -l "$APK" | grep "assets/index.android.bundle"
          unzip -p "$APK" assets/index.android.bundle > /tmp/index.android.bundle
          echo "Bundled JS size:"
          ls -lh /tmp/index.android.bundle
          # Hermes bundle icindeki okunabilir stringler ile guncel ekran adlarini dogrula.
          strings /tmp/index.android.bundle | grep -E "LiveBridge|HomeDashboard|Acil Durum|AyTalk" | head -30 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AyTalk-Android-Release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
