apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // AyTalk CI ve yerel derlemenin daima proje kokundeki guncel JS kodunu kullanmasini zorlar.
    root = file("../../")
    entryFile = file("../../index.js")

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


def readAyTalkEnvValue = { String key ->
    def fromEnvironment = System.getenv(key)
    if (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) {
        return fromEnvironment.trim()
    }

    // android/ klasorunun bir ustundeki, GitHub'a girmeyen proje .env dosyasi.
    def envFile = rootProject.file("../.env")
    if (!envFile.exists()) {
        return ""
    }

    def prefix = key + "="
    def line = envFile.readLines("UTF-8").find { raw ->
        def clean = raw.trim()
        !clean.startsWith("#") && clean.startsWith(prefix)
    }

    if (line == null) {
        return ""
    }

    def value = line.trim().substring(prefix.length()).trim()
    if ((value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))) {
        value = value.substring(1, value.length() - 1)
    }
    return value
}

def escapeBuildConfigString = { String value ->
    return value
        .replace("\\", "\\\\")
        .replace('"', '\\"')
}

def ayTalkAppSharedKey = readAyTalkEnvValue("APP_SHARED_KEY")
if (ayTalkAppSharedKey.isEmpty()) {
    logger.warn("AyTalk: APP_SHARED_KEY bulunamadi. Render'da APP_SHARED_KEY aktifse API istekleri 401 alir.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aytalkrn"

    defaultConfig {
        applicationId "com.aytalkrn"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1-ci"
        buildConfigField "String", "APP_SHARED_KEY", "\"${escapeBuildConfigString(ayTalkAppSharedKey)}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
